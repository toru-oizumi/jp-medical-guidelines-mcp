name: watch-guidelines

on:
  schedule:
    - cron: "0 0 * * 1" # 毎週月曜 09:00 JST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - id: check
        continue-on-error: true
        run: |
          # 差分があれば exit 1。ここでは落とさず、出力を次のステップに渡す。
          set +e
          out=$(npx tsx scripts/check-updates.ts 2>&1)
          echo "$out"
          {
            echo "report<<REPORT"
            echo "$out"
            echo "REPORT"
          } >> "$GITHUB_OUTPUT"
          exit 0
      - if: contains(steps.check.outputs.report, '[')
        uses: actions/github-script@v7
        env:
          # 掲載ページから読んだ文字列が混ざるので、script に埋め込まず env で渡す
          REPORT: ${{ steps.check.outputs.report }}
        with:
          script: |
            const title = "ガイドラインの更新を検知";
            const body = [
              "掲載ページとの差分を検知しました。",
              "",
              "```",
              process.env.REPORT,
              "```",
              "",
              "原本を確認し、`npm run data` を実行して data/ を更新してください。",
            ].join("\n");
            const existing = await github.rest.issues.listForRepo({
              owner: context.repo.owner, repo: context.repo.repo, state: "open", labels: "guideline-update",
            });
            if (existing.data.some(i => i.title === title)) return;
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title, body, labels: ["guideline-update"],
            });
